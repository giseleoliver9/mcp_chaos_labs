[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tool-failure-lab"
version = "0.1.0"
description = "Agent reliability benchmark for simulated MCP tool failures."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "Tool Failure Lab contributors" }
]
dependencies = [
  "fastapi>=0.111,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "pydantic>=2.7,<3.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2,<9.0",
  "httpx>=0.27,<1.0"
]

[project.scripts]
tool-failure-lab = "app.cli:main"

[tool.setuptools.packages.find]
include = ["app*"]
